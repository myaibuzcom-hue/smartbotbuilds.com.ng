/* ---------------------------------------------------------------
   SMALL PRIMITIVES
---------------------------------------------------------------- */
function Avatar({ initials, size = 32, tone = "navy" }) {
  const bg = tone === "gold" ? C.gold : C.navy;
  return (
    <div
      style={{ width: size, height: size, background: bg, color: "#fff", fontSize: size * 0.36 }}
      className="rounded-full flex items-center justify-center font-semibold shrink-0"
    >
      {initials}
    </div>
  );
}

function Badge({ children, bg, fg }) {
  return (
    <span
      style={{ background: bg, color: fg }}
      className="px-2.5 py-1 rounded-md text-xs font-medium inline-block whitespace-nowrap"
    >
      {children}
    </span>
  );
}

function Card({ children, className = "", padded = true }) {
  return (
    <div
      style={{ background: C.card, border: `1px solid ${C.border}` }}
      className={`rounded-xl shadow-[0_1px_2px_rgba(23,32,51,0.04)] ${padded ? "p-5" : ""} ${className}`}
    >
      {children}
    </div>
  );
}

function KpiCard({ icon: Icon, label, value, delta, deltaDir, sub, gold }) {
  const up = deltaDir === "up";
  return (
    <Card className="flex-1 min-w-[190px]">
      <div className="flex items-start justify-between">
        <div>
          <div style={{ color: C.textSub }} className="text-[13px] font-medium mb-2">{label}</div>
          <div style={{ color: gold ? C.gold : C.text }} className="text-[26px] font-bold leading-none">{value}</div>
        </div>
        <div
          style={{ background: gold ? "#FCF6E6" : "#EEF1F6", color: gold ? C.gold : C.navy }}
          className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
        >
          <Icon size={18} />
        </div>
      </div>
      <div className="flex items-center gap-1 mt-3 text-[12.5px]">
        <span style={{ color: up ? C.success : C.danger }} className="flex items-center gap-0.5 font-semibold">
          {up ? <TrendingUp size={13} /> : <TrendingDown size={13} />} {delta}
        </span>
        <span style={{ color: C.textSub }}>{sub}</span>
      </div>
    </Card>
  );
}

function PrimaryButton({ children, icon: Icon, onClick, className = "" }) {
  return (
    <button
      onClick={onClick}
      style={{ background: C.gold, color: C.navyDeep }}
      className={`px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 hover:brightness-95 transition ${className}`}
    >
      {Icon && <Icon size={15} />} {children}
    </button>
  );
}
function GhostButton({ children, icon: Icon, onClick, className = "" }) {
  return (
    <button
      onClick={onClick}
      style={{ border: `1px solid ${C.border}`, color: C.text }}
      className={`px-3.5 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 hover:bg-[#F1F2F5] transition bg-white ${className}`}
    >
      {Icon && <Icon size={15} />} {children}
    </button>
  );
}

/* ---------------------------------------------------------------
   SIDEBAR + HEADER (Internal App Shell)
---------------------------------------------------------------- */
function Sidebar({ active, onNav, collapsed, setCollapsed }) {
  return (
    <div
      style={{ background: C.navy, width: collapsed ? 76 : 240, transition: "width .2s ease" }}
      className="shrink-0 h-full flex flex-col py-5"
    >
      <div className="flex items-center gap-2.5 px-5 mb-8">
        <div style={{ background: C.gold }} className="w-8 h-8 rounded-md flex items-center justify-center text-[13px] font-bold text-[#1A2A4A] shrink-0">SW</div>
        {!collapsed && <span className="text-white font-semibold text-[15px] tracking-tight">SmartWork CRM</span>}
      </div>

      <div className="flex-1 flex flex-col gap-0.5 px-3">
        {navItems.map((item) => {
          const isActive = active === item.key;
          const Icon = item.icon;
          return (
            <button
              key={item.key}
              onClick={() => onNav(item.key)}
              style={{
                background: isActive ? "rgba(212,168,67,0.14)" : "transparent",
                color: isActive ? C.gold : "rgba(255,255,255,0.75)",
              }}
              className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition hover:bg-white/5"
            >
              <Icon size={17} className="shrink-0" />
              {!collapsed && <span className="truncate">{item.label}</span>}
            </button>
          );
        })}
      </div>

      <div className="px-3 mt-4">
        <button
          onClick={() => setCollapsed(!collapsed)}
          className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-white/50 hover:text-white/80 hover:bg-white/5 text-sm"
        >
          {collapsed ? <ChevronRight size={16} /> : <ChevronLeft size={16} />}
          {!collapsed && <span>Collapse</span>}
        </button>
      </div>

      <div style={{ borderTop: "1px solid rgba(255,255,255,0.1)" }} className="mx-3 mt-3 pt-3 flex items-center gap-2.5 px-1">
        <div style={{ background: "rgba(255,255,255,0.1)" }} className="w-7 h-7 rounded-md flex items-center justify-center text-white text-[11px] font-bold shrink-0">OD</div>
        {!collapsed && (
          <div className="min-w-0">
            <div className="text-white text-[12.5px] font-semibold truncate">OVIE DAVID Trading LTD</div>
            <div className="text-white/40 text-[11px]">Nigerian Procurement Co.</div>
          </div>
        )}
      </div>
    </div>
  );
}

          <Search size={15} style={{ color: C.textSub }} />

        <div>
          <h2 style={{ color: C.text }} className="text-[24px] font-bold">Good morning, David</h2>

        <GhostButton icon={Calendar}>September 7, 2026 <ChevronDown size={14} /></GhostButton>

      <div className="flex gap-4 flex-wrap">
        <div onClick={onOpenLead} className="cursor-pointer flex-1 min-w-[190px]">
          <KpiCard icon={Users} label="Total Leads" value="24" delta="12%" deltaDir="up" sub="vs. last week" />
        </div>
        <div onClick={onOpenOrders} className="cursor-pointer flex-1 min-w-[190px]">
          <KpiCard icon={Package} label="Active Orders" value="12" delta="8%" deltaDir="up" sub="vs. last week" />

        <KpiCard icon={Wallet} label="Revenue — MTD" value={naira(4200000)} delta="22%" deltaDir="up" sub="vs. last month" gold />
      </div>

      <div className="grid grid-cols-3 gap-5">
        <Card className="col-span-2">
          <div className="flex items-center justify-between mb-1">
            <h3 style={{ color: C.text }} className="font-semibold text-[15px]">Revenue Performance</h3>
            <div style={{ background: "#F1F2F5" }} className="flex text-[12px] rounded-lg p-0.5">
              {["7 Days", "30 Days", "3 Months", "12 Months"].map((t, i) => (
                <span key={t} style={i === 0 ? { background: C.navy, color: "#fff" } : { color: C.textSub }} className="px-2.5 py-1 rounded-md font-medium cursor-pointer">{t}</span>
              ))}
            </div>
          </div>
          <div className="h-[220px] mt-3">
            <ResponsiveContainer width="100%" height="100%">
              <LineChart data={revenueData} margin={{ left: -18, top: 5 }}>
                <CartesianGrid stroke={C.border} vertical={false} />
                <XAxis dataKey="d" tick={{ fontSize: 12, fill: C.textSub }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: C.textSub }} axisLine={false} tickLine={false} tickFormatter={(v) => `₦${v / 1000}k`} />
                <RTooltip formatter={(v) => naira(v)} contentStyle={{ borderRadius: 8, fontSize: 12, border: `1px solid ${C.border}` }} />
                <Line type="monotone" dataKey="v" stroke={C.gold} strokeWidth={2.5} dot={{ r: 3, fill: C.gold }} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </Card>

        <Card>
          <h3 style={{ color: C.text }} className="font-semibold text-[15px] mb-4">Order Pipeline</h3>
          <div className="flex flex-col gap-4">
            {pipeline.map((p) => (
              <div key={p.label}>
                <div className="flex justify-between text-[13px] mb-1.5">
                  <span style={{ color: C.text }} className="font-medium">{p.label}</span>
                  <span style={{ color: C.textSub }}>{p.count}</span>
                </div>
                <div style={{ background: "#EEF0F3" }} className="h-2 rounded-full overflow-hidden">
                  <div style={{ width: `${(p.count / maxCount) * 100}%`, background: p.color }} className="h-full rounded-full" />
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      <div className="grid grid-cols-3 gap-5">
        <Card className="col-span-2">
          <h3 style={{ color: C.text }} className="font-semibold text-[15px] mb-4">Recent Activity</h3>
          <div className="flex flex-col">
            {activity.map((a, i) => (
              <div key={a.id} style={{ borderTop: i > 0 ? `1px solid ${C.border}` : "none" }} className="flex items-center gap-3 py-3">
                <div
                  style={{
                    background: a.type === "deal" ? "#FCF6E6" : a.type === "delivery" ? "#E9F8EF" : "#EAF1FE",
                    color: a.type === "deal" ? C.gold : a.type === "delivery" ? C.success : C.info,
                  }}
                  className="w-8 h-8 rounded-full flex items-center justify-center shrink-0"
                >
                  {a.type === "order" && <Package size={14} />}
                  {a.type === "lead" && <Users size={14} />}
                  {a.type === "delivery" && <CheckCircle2 size={14} />}
                  {a.type === "deal" && <Wallet size={14} />}

                <div className="flex-1 min-w-0">
                  <div style={{ color: C.text }} className="text-[13.5px] font-medium truncate">{a.text}</div>
                  {a.sub && <div style={{ color: C.textSub }} className="text-[12.5px]">{a.sub}</div>}
                </div>
                <div style={{ color: C.textSub }} className="text-[12px] shrink-0">{a.time}</div>
              </div>
            ))}
          </div>
        </Card>

        <Card>
          <h3 style={{ color: C.text }} className="font-semibold text-[15px] mb-4">Quick Actions</h3>
          <div className="flex flex-col gap-2.5">
            <PrimaryButton icon={Plus} className="w-full justify-center">Add Lead</PrimaryButton>
            <GhostButton icon={Package} className="w-full justify-center">New Order</GhostButton>
            <GhostButton icon={CheckSquare} className="w-full justify-center">Create Task</GhostButton>
            <GhostButton icon={FileText} className="w-full justify-center">Generate Quote</GhostButton>
          </div>
        </Card>
      </div>
    </div>
  );

              <div className="flex justify-between text-[10.5px] mt-2" style={{ color: C.textSub }}>
                <span>Pending 3</span><span>Processing 4</span><span>Transit 2</span><span>Delivered 5</span>
              </div>
            </Card>
          </div>

          <div className="px-5 mt-4 pb-24">
            <div style={{ color: C.text }} className="font-semibold text-[13px] mb-2">Recent Activity</div>
            <div className="flex flex-col gap-2.5">
              {activity.map((a) => (
                <Card key={a.id} className="!p-3">
                  <div style={{ color: C.text }} className="text-[12.5px] font-medium">{a.text}</div>
                  <div style={{ color: C.textSub }} className="text-[11px] mt-0.5">{a.time}</div>
                </Card>
              ))}
            </div>
          </div>

          <button
            style={{ background: C.gold, color: C.navyDeep }}
            className="absolute bottom-5 right-5 w-14 h-14 rounded-full flex items-center justify-center shadow-lg"
          >
            <Plus size={24} />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   ROOT APP
---------------------------------------------------------------- */
function SmartWorkCRM() {
  const [view, setView] = useState("desktop"); // desktop | portal | mobile
  const [screen, setScreen] = useState("dashboard");
  const [collapsed, setCollapsed] = useState(false);
  const [selectedLead, setSelectedLead] = useState(null);
  const [selectedOrder, setSelectedOrder] = useState(null);

  const screenTitles = {
    dashboard: null,
    leads: null,
    orders: null,
    team: null,
    tasks: { title: "Tasks", subtitle: "Coming soon in this prototype." },
    revenue: { title: "Revenue", subtitle: "Coming soon in this prototype." },
    messages: { title: "Messages", subtitle: "Coming soon in this prototype." },
    reports: { title: "Reports", subtitle: "Coming soon in this prototype." },
    settings: { title: "Settings", subtitle: "Coming soon in this prototype." },
  };

  return (
    <div style={{ fontFamily: "Inter, ui-sans-serif, system-ui" }} className="w-full h-full flex flex-col" >
      {/* Meta switcher for this demo/presentation */}
      <div style={{ background: C.navyDeep }} className="flex items-center justify-center gap-1 py-2 px-3 shrink-0">
        {[
          { key: "desktop", label: "Desktop CRM" },
          { key: "portal", label: "Client Portal" },
          { key: "mobile", label: "Mobile Dashboard" },
        ].map((v) => (
          <button
            key={v.key}
            onClick={() => setView(v.key)}
            style={{
              background: view === v.key ? C.gold : "transparent",
              color: view === v.key ? C.navyDeep : "rgba(255,255,255,0.6)",
            }}
            className="px-3.5 py-1.5 rounded-md text-[12.5px] font-semibold transition"
          >
            {v.label}
          </button>
        ))}
      </div>

      <div style={{ background: C.bg }} className="flex-1 overflow-hidden">
        {view === "desktop" && (
          <div className="flex h-full">
            <Sidebar active={screen} onNav={setScreen} collapsed={collapsed} setCollapsed={setCollapsed} />
            <div className="flex-1 flex flex-col overflow-hidden">
              {screenTitles[screen] && <TopHeader title={screenTitles[screen].title} subtitle={screenTitles[screen].subtitle} />}
              {screen !== "dashboard" && screen !== "leads" && screen !== "orders" && screen !== "team" && (
                <div className="flex-1 flex items-center justify-center">
                  <p style={{ color: C.textSub }} className="text-sm">This section isn't part of the prototype yet.</p>
                </div>
              )}
              <div className="flex-1 overflow-y-auto">
                {screen === "dashboard" && (
                  <Dashboard onOpenLead={() => setScreen("leads")} onOpenOrders={() => setScreen("orders")} />
                )}
                {screen === "leads" && <LeadsClients onSelect={setSelectedLead} />}
                {screen === "orders" && <OrderPipeline onSelect={setSelectedOrder} />}
                {screen === "team" && <TeamPerformance />}
              </div>
            </div>
          </div>
        )}

        {view === "portal" && <div className="h-full overflow-y-auto"><ClientPortal /></div>}
        {view === "mobile" && <div className="h-full overflow-y-auto"><MobileDashboard /></div>}
      </div>

      <ClientDrawer lead={selectedLead} onClose={() => setSelectedLead(null)} />
      <OrderDetailModal order={selectedOrder} onClose={() => setSelectedOrder(null)} />
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<SmartWorkCRM />);
</script>
</body>
</html>
