<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBot Builds — Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #080c08;
      --bg-secondary: #0f160f;
      --bg-card: rgba(255,255,255,0.03);
      --border-color: rgba(255,255,255,0.06);
      --text-primary: #e8f5e8;
      --text-secondary: #7a9e7a;
      --text-muted: #4a6a4a;
      --green: #00c853;
      --green-glow: rgba(0,200,83,0.15);
      --orange: #ff9100;
      --orange-glow: rgba(255,145,0,0.15);
      --red: #ff3d57;
      --red-glow: rgba(255,61,87,0.15);
      --blue: #3b82f6;
      --blue-glow: rgba(59,130,246,0.15);
      --purple: #8b5cf6;
      --purple-glow: rgba(139,92,246,0.15);
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font);
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(0,200,83,0.03) 0%, transparent 70%),
                        radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.03) 0%, transparent 70%);
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left h1 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #00c853, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-left p {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 100px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .btn-logout {
      padding: 6px 16px;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 100px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      backdrop-filter: blur(10px);
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.1);
      box-shadow: var(--shadow);
    }

    .stat-card .number {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .stat-card .label { color: var(--text-secondary); font-size: 12px; font-weight: 500; margin-top: 2px; }
    .stat-card .glow { position: absolute; top: -50%; right: -20%; width: 100px; height: 100px; border-radius: 50%; opacity: 0.04; filter: blur(50px); }
    .stat-card:nth-child(1) .glow { background: var(--blue); }
    .stat-card:nth-child(2) .glow { background: var(--green); }
    .stat-card:nth-child(3) .glow { background: var(--orange); }
    .stat-card:nth-child(4) .glow { background: var(--purple); }

    .stat-card .number.green { color: var(--green); }
    .stat-card .number.blue { color: var(--blue); }
    .stat-card .number.orange { color: var(--orange); }
    .stat-card .number.purple { color: var(--purple); }

    /* ===== REVENUE BAR ===== */
    .revenue-bar-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .revenue-bar-wrap .row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    .revenue-bar-wrap .row .label { color: var(--text-secondary); }
    .revenue-bar-wrap .row .value { font-weight: 600; }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 100px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-track .fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, var(--green), #3b82f6);
      transition: width 1s ease;
      width: 0%;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 4px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: 0.2s;
      border: none;
      background: transparent;
    }
    .tab.active { background: rgba(255,255,255,0.06); color: var(--text-primary); }
    .tab:hover { color: var(--text-primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== TABLE ===== */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--text-secondary);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }
    .badge-new { background: var(--blue-glow); color: var(--blue); }
    .badge-brief_received { background: var(--orange-glow); color: var(--orange); }
    .badge-quoted { background: var(--purple-glow); color: var(--purple); }
    .badge-converted { background: var(--green-glow); color: var(--green); }

    .btn {
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .btn:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
    .btn-primary { background: var(--blue); color: #fff; border: none; }
    .btn-primary:hover { background: #2563eb; }
    .btn-green { background: var(--green); color: #000; border: none; }
    .btn-green:hover { background: #00b84a; }

    .btn-sm { padding: 4px 10px; font-size: 10px; }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-box input {
      flex: 1;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--green); }
    .search-box input::placeholder { color: var(--text-muted); }

    .empty { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

    /* ===== QUICK ACTIONS ===== */
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .qa-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
    }
    .qa-card h4 { font-size: 13px; margin-bottom: 10px; }
    .qa-card input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      margin-bottom: 6px;
      outline: none;
    }
    .qa-card input:focus { border-color: var(--green); }
    .qa-card .btn { width: 100%; padding: 8px; font-size: 13px; }

    /* ===== LOGIN ===== */
    .login {
      max-width: 380px;
      margin: 80px auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 40px;
      backdrop-filter: blur(10px);
    }
    .login h1 {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00c853, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login .sub {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .login input {
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    .login input:focus { border-color: var(--green); }
    .login .btn { width: 100%; padding: 14px; font-size: 16px; background: linear-gradient(135deg, var(--green), #009624); color: #000; border: none; border-radius: 100px; cursor: pointer; font-weight: 700; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .quick-actions { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .header-left h1 { font-size: 20px; }
      .header { flex-direction: column; align-items: flex-start; }
      .header-right { width: 100%; }
    }

    .file-link {
      color: var(--blue);
      text-decoration: none;
      font-size: 12px;
    }
    .file-link:hover { text-decoration: underline; }

    .reload-btn {
      padding: 6px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 100px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
    }
    .reload-btn:hover { background: rgba(255,255,255,0.06); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 100px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container" id="app"></div>

  <script>
  // ============================================================
  // PIN LOCK
  // ============================================================
  const CORRECT_PIN = "1925";
  let entered = "";
  const dots = document.querySelectorAll("#pinDots span");
  const lock = document.getElementById("lock");

  function renderDots(){
    dots.forEach((d,i)=> d.classList.toggle("filled", i < entered.length));
  }

  document.querySelectorAll("#keypad button[data-k]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(entered.length >= 4) return;
      entered += btn.dataset.k;
      renderDots();
      if(entered.length === 4){
        if(entered === CORRECT_PIN){
          setTimeout(()=> lock.classList.add("hidden"), 200);
          loadDashboardData(); // Load data after unlock
        } else {
          lock.classList.add("shake");
          setTimeout(()=>{ lock.classList.remove("shake"); entered=""; renderDots(); }, 400);
        }
      }
    });
  });
  document.getElementById("clearBtn").addEventListener("click", ()=>{ entered=""; renderDots(); });
  document.getElementById("delBtn").addEventListener("click", ()=>{ entered = entered.slice(0,-1); renderDots(); });

  // ============================================================
  // API BASE
  // ============================================================
  const API_BASE = 'https://smartbot-genius-bot.myaibuzcom-hue.deno.net';

  // ============================================================
  // LOAD DASHBOARD DATA
  // ============================================================
  async function loadDashboardData() {
    try {
      // Fetch stats
      const statsRes = await fetch(API_BASE + '/api/sb-stats');
      const stats = await statsRes.json();

      // Fetch projects
      const projectsRes = await fetch(API_BASE + '/api/sb-projects');
      const projects = await projectsRes.json();

      // Fetch briefs
      const briefsRes = await fetch(API_BASE + '/api/sb-briefs');
      const briefs = await briefsRes.json();

      // Fetch leads
      const leadsRes = await fetch(API_BASE + '/api/sb-leads');
      const leads = await leadsRes.json();

      // ---- UPDATE STATS ----
      document.querySelectorAll('.stat-card .num').forEach(el => {
        const label = el.closest('.stat-card')?.querySelector('.lbl')?.textContent?.trim() || '';
        if (label.includes('Revenue pipeline')) {
          el.textContent = '₦' + (stats.pipeline_value || 0).toLocaleString();
        } else if (label.includes('Converted revenue')) {
          el.textContent = '₦' + (stats.converted_value || 0).toLocaleString();
        } else if (label.includes('Total projects')) {
          el.textContent = stats.total_projects || 0;
        } else if (label.includes('Briefs uploaded')) {
          el.textContent = stats.briefs_uploaded || 0;
        } else if (label.includes('New leads (30d)')) {
          el.textContent = stats.new_leads_30d || 0;
        } else if (label.includes('Converted clients')) {
          el.textContent = stats.converted || 0;
        }
      });

      // ---- UPDATE GOAL CARD ----
      const pipeline = stats.pipeline_value || 0;
      const target = 500000;
      const pct = Math.min((pipeline / target) * 100, 100);
      document.querySelector('.goal-top b').textContent = '₦' + pipeline.toLocaleString() + ' / ₦' + target.toLocaleString() + ' · ' + Math.round(pct) + '%';
      document.querySelector('.goal-fill').style.width = Math.min(pct, 100) + '%';

      // ---- UPDATE PROJECTS TABLE ----
      const projectRows = projects.slice(0, 10).map(p => {
        const statusMap = {
          'new': 'badge-new',
          'brief_received': 'badge-brief',
          'quoted': 'badge-quoted',
          'converted': 'badge-converted',
          'closed': 'badge-closed'
        };
        const statusLabel = p.status || 'new';
        const badgeClass = statusMap[statusLabel] || 'badge-new';
        const displayStatus = statusLabel.replace('_', ' ').toUpperCase();
        return `<tr data-name="${(p.name || '').toLowerCase()} ${(p.business_name || '').toLowerCase()}" data-status="${statusLabel}">
          <td class="cell-main">${p.name || 'Unknown'}</td>
          <td>${p.business_name || '—'}</td>
          <td>${p.service_type || '—'}</td>
          <td>${p.budget ? '₦' + Number(p.budget).toLocaleString() : '—'}</td>
          <td><span class="badge ${badgeClass}">${displayStatus}</span></td>
          <td>${p.source || '—'}</td>
          <td>${new Date(p.created_at).toLocaleDateString()}</td>
          <td>${p.brief_file_url ? '<span class="link-btn" onclick="window.open(\'' + p.brief_file_url + '\',\'_blank\')">View</span>' : '—'}</td>
        </tr>`;
      }).join('');
      document.querySelector('#projectsTable tbody').innerHTML = projectRows || '<tr><td colspan="8" style="text-align:center;color:var(--text-faint);padding:30px;">No projects yet</td></tr>';

      // ---- UPDATE BRIEFS ----
      const briefHtml = briefs.slice(0, 8).map(b => {
        const fileName = b.brief_file_name || 'brief.pdf';
        return `<div class="brief-card">
          <div class="fname">${fileName}</div>
          <div class="fmeta"><div>${b.name || 'Unknown'}</div>
          <div>${b.phone || '—'}</div>
          <div>${new Date(b.created_at).toLocaleDateString()}</div></div>
          <div class="brief-actions">
            <button onclick="window.open('${b.brief_file_url || '#'}','_blank')">View</button>
            <button onclick="window.open('${b.brief_file_url || '#'}','_blank')">Download</button>
          </div>
        </div>`;
      }).join('');
      document.querySelector('.brief-grid').innerHTML = briefHtml || '<div style="color:var(--text-faint);padding:20px;">No briefs uploaded yet</div>';

      // ---- UPDATE LEADS TABLE ----
      const leadRows = leads.slice(0, 10).map(l => {
        const tagClass = 
          l.tag?.includes('High') ? 'tag-high' :
          l.tag?.includes('Warm') ? 'tag-warm' :
          l.tag?.includes('Cold') ? 'tag-cold' :
          l.tag?.includes('Returning') ? 'tag-returning' : 'tag-follow';
        return `<tr data-name="${(l.full_name || '').toLowerCase()}">
          <td class="cell-main">${l.full_name || 'Unknown'}</td>
          <td>${l.lead_phone || '—'}</td>
          <td>${l.status || 'New'}</td>
          <td><span class="badge ${tagClass}">${l.tag || '—'}</span></td>
          <td>${l.source || 'WhatsApp'}</td>
          <td>${new Date(l.created_at).toLocaleDateString()}</td>
        </tr>`;
      }).join('');
      document.querySelector('#leadsTable tbody').innerHTML = leadRows || '<tr><td colspan="6" style="text-align:center;color:var(--text-faint);padding:30px;">No leads yet</td></tr>';

      // ---- UPDATE PIPELINE FUNNEL ----
      const leadCount = stats.new_leads_30d || 0;
      const projectCount = stats.total_projects || 0;
      const briefCount = stats.briefs_uploaded || 0;
      const quotedCount = projects.filter(p => p.status === 'quoted').length || 0;
      const convertedCount = stats.converted || 0;

      const funnelStages = [
        { label: 'Lead', count: leadCount + projectCount + briefCount + quotedCount + convertedCount || 100 },
        { label: 'Project request', count: projectCount || 50 },
        { label: 'Brief received', count: briefCount || 30 },
        { label: 'Quote sent', count: quotedCount || 15 },
        { label: 'Paid client', count: convertedCount || 5 }
      ];

      const maxFunnel = Math.max(...funnelStages.map(s => s.count), 1);
      const funnelBars = document.querySelectorAll('.funnel-stage .funnel-bar');
      document.querySelectorAll('.funnel-stage').forEach((stage, i) => {
        if (i < funnelStages.length) {
          const s = funnelStages[i];
          stage.querySelector('.fnum').textContent = s.count;
          stage.querySelector('.flbl').textContent = s.label;
          const pct = Math.round((s.count / funnelStages[0].count) * 100);
          stage.querySelector('.fpct').textContent = pct + '%';
          if (funnelBars[i]) {
            funnelBars[i].style.width = Math.max((s.count / maxFunnel) * 100, 8) + '%';
          }
        }
      });

      // ---- UPDATE CHARTS (with real data) ----
      // Group projects by month
      const monthMap = {};
      projects.forEach(p => {
        const d = new Date(p.created_at);
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        monthMap[key] = (monthMap[key] || 0) + 1;
      });
      const months = Object.keys(monthMap).sort().slice(-6);
      const projectCounts = months.map(m => monthMap[m] || 0);

      // Update project chart
      const chartProjects = Chart.getChart('chartProjects');
      if (chartProjects) {
        chartProjects.data.labels = months.map(m => {
          const [y, mo] = m.split('-');
          return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(mo)-1] + ' ' + y.slice(2);
        });
        chartProjects.data.datasets[0].data = projectCounts.length ? projectCounts : [0];
        chartProjects.update();
      }

      // ---- UPDATE NOTIFICATIONS ----
      const notifItems = document.querySelectorAll('.notif-item');
      if (notifItems.length > 0) {
        // Show latest project as first notification
        if (projects.length > 0) {
          const latest = projects[0];
          notifItems[0].querySelector('p').innerHTML = `<b>New project request</b> — ${latest.name || 'Unknown'}`;
          notifItems[0].querySelector('span').textContent = new Date(latest.created_at).toLocaleDateString();
        }
        // Show latest lead as second notification
        if (leads.length > 0) {
          const latestLead = leads[0];
          notifItems[1].querySelector('p').innerHTML = `<b>New WhatsApp lead</b> — ${latestLead.full_name || 'Unknown'}`;
          notifItems[1].querySelector('span').textContent = new Date(latestLead.created_at).toLocaleDateString();
        }
        // Show latest brief as third notification
        if (briefs.length > 0) {
          const latestBrief = briefs[0];
          notifItems[2].querySelector('p').innerHTML = `<b>New brief uploaded</b> — ${latestBrief.name || 'Unknown'}`;
          notifItems[2].querySelector('span').textContent = new Date(latestBrief.created_at).toLocaleDateString();
        }
      }

    } catch (err) {
      console.error('Error loading dashboard data:', err);
      // Show error in the UI
      document.querySelector('.stats-grid').innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--red);">
          <p>⚠️ Error loading data. Please refresh or check your internet connection.</p>
          <p style="font-size:0.8rem;color:var(--text-faint);margin-top:8px;">${err.message}</p>
          <button onclick="loadDashboardData()" style="margin-top:12px;padding:8px 20px;background:var(--green);border:none;border-radius:8px;color:#000;font-weight:600;cursor:pointer;">Retry</button>
        </div>
      `;
    }
  }

  // ============================================================
  // NOTIFICATIONS
  // ============================================================
  const notifBtn = document.getElementById("notifBtn");
  const notifPanel = document.getElementById("notifPanel");
  notifBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    notifPanel.classList.toggle("open");
  });
  document.addEventListener("click", ()=> notifPanel.classList.remove("open"));

  // ============================================================
  // REFRESH
  // ============================================================
  document.getElementById("refreshBtn").addEventListener("click", (e)=>{
    e.currentTarget.style.transform = "rotate(360deg)";
    e.currentTarget.style.transition = "transform .5s";
    loadDashboardData();
    setTimeout(()=>{ e.currentTarget.style.transform = ""; }, 500);
  });

  // ============================================================
  // MODAL
  // ============================================================
  const modalOverlay = document.getElementById("modalOverlay");
  document.getElementById("addProjectBtn").addEventListener("click", ()=> modalOverlay.classList.add("open"));
  document.getElementById("closeModal").addEventListener("click", ()=> modalOverlay.classList.remove("open"));
  modalOverlay.addEventListener("click", (e)=>{ if(e.target === modalOverlay) modalOverlay.classList.remove("open"); });

  // ============================================================
  // SEARCH & FILTER
  // ============================================================
  document.getElementById("globalSearch").addEventListener("input", (e)=>{
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll("#projectsTable tbody tr, #leadsTable tbody tr").forEach(row=>{
      const hay = row.dataset.name || "";
      row.classList.toggle("hidden-row", q && !hay.includes(q));
    });
  });

  document.getElementById("statusFilter").addEventListener("change", (e)=>{
    const val = e.target.value;
    document.querySelectorAll("#projectsTable tbody tr").forEach(row=>{
      row.classList.toggle("hidden-row", val && row.dataset.status !== val);
    });
  });

  // ============================================================
  // EXPORT CSV
  // ============================================================
  document.getElementById("exportCsv").addEventListener("click", async ()=>{
    try {
      const res = await fetch(API_BASE + '/api/sb-projects');
      const data = await res.json();
      if (!data || data.length === 0) {
        alert('No data to export');
        return;
      }
      const headers = ['Name', 'Business', 'Service', 'Budget', 'Status', 'Source', 'Date'];
      const rows = data.map(p => [
        p.name || '',
        p.business_name || '',
        p.service_type || '',
        p.budget ? '₦' + Number(p.budget).toLocaleString() : '',
        p.status || '',
        p.source || '',
        new Date(p.created_at).toLocaleDateString()
      ]);
      const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'projects_export_' + new Date().toISOString().slice(0,10) + '.csv';
      link.click();
    } catch (err) {
      alert('Error exporting: ' + err.message);
    }
  });

  // ============================================================
  // ADD PROJECT (via Modal)
  // ============================================================
  document.querySelector('.modal .btn-green').addEventListener('click', async ()=>{
    const inputs = document.querySelectorAll('.modal input, .modal select');
    const name = inputs[0]?.value?.trim();
    const business = inputs[1]?.value?.trim();
    const service = inputs[2]?.value || 'CRM & automation';
    const budget = inputs[3]?.value?.trim();

    if (!name) {
      alert('Please enter a client name');
      return;
    }

    try {
      const res = await fetch(API_BASE + '/api/sb-quick-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'add-project',
          data: { name, phone: 'Manual entry', business, service, description: 'Added from dashboard', budget }
        })
      });
      const result = await res.json();
      if (result.success) {
        alert('✅ Project added successfully!');
        modalOverlay.classList.remove('open');
        loadDashboardData();
      } else {
        alert('❌ Error: ' + (result.error || 'Unknown error'));
      }
    } catch (err) {
      alert('❌ Error: ' + err.message);
    }
  });

  // ============================================================
  // INIT
  // ============================================================
  // Data loads after PIN unlock via loadDashboardData()
</script>
</body>
</html>
