<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBot Builds — Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #080c08;
      --bg-secondary: #0f160f;
      --bg-card: rgba(255,255,255,0.03);
      --border-color: rgba(255,255,255,0.06);
      --text-primary: #e8f5e8;
      --text-secondary: #7a9e7a;
      --text-muted: #4a6a4a;
      --green: #00c853;
      --green-glow: rgba(0,200,83,0.15);
      --orange: #ff9100;
      --orange-glow: rgba(255,145,0,0.15);
      --red: #ff3d57;
      --red-glow: rgba(255,61,87,0.15);
      --blue: #3b82f6;
      --blue-glow: rgba(59,130,246,0.15);
      --purple: #8b5cf6;
      --purple-glow: rgba(139,92,246,0.15);
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font);
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(0,200,83,0.03) 0%, transparent 70%),
                        radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.03) 0%, transparent 70%);
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left h1 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #00c853, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-left p {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 100px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .btn-logout {
      padding: 6px 16px;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 100px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      backdrop-filter: blur(10px);
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.1);
      box-shadow: var(--shadow);
    }

    .stat-card .number {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .stat-card .label { color: var(--text-secondary); font-size: 12px; font-weight: 500; margin-top: 2px; }
    .stat-card .glow { position: absolute; top: -50%; right: -20%; width: 100px; height: 100px; border-radius: 50%; opacity: 0.04; filter: blur(50px); }
    .stat-card:nth-child(1) .glow { background: var(--blue); }
    .stat-card:nth-child(2) .glow { background: var(--green); }
    .stat-card:nth-child(3) .glow { background: var(--orange); }
    .stat-card:nth-child(4) .glow { background: var(--purple); }

    .stat-card .number.green { color: var(--green); }
    .stat-card .number.blue { color: var(--blue); }
    .stat-card .number.orange { color: var(--orange); }
    .stat-card .number.purple { color: var(--purple); }

    /* ===== REVENUE BAR ===== */
    .revenue-bar-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .revenue-bar-wrap .row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    .revenue-bar-wrap .row .label { color: var(--text-secondary); }
    .revenue-bar-wrap .row .value { font-weight: 600; }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 100px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-track .fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, var(--green), #3b82f6);
      transition: width 1s ease;
      width: 0%;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 4px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: 0.2s;
      border: none;
      background: transparent;
    }
    .tab.active { background: rgba(255,255,255,0.06); color: var(--text-primary); }
    .tab:hover { color: var(--text-primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== TABLE ===== */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left;
      padding: 10px 12px;
      color: var(--text-secondary);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }
    .badge-new { background: var(--blue-glow); color: var(--blue); }
    .badge-brief_received { background: var(--orange-glow); color: var(--orange); }
    .badge-quoted { background: var(--purple-glow); color: var(--purple); }
    .badge-converted { background: var(--green-glow); color: var(--green); }

    .btn {
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .btn:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
    .btn-primary { background: var(--blue); color: #fff; border: none; }
    .btn-primary:hover { background: #2563eb; }
    .btn-green { background: var(--green); color: #000; border: none; }
    .btn-green:hover { background: #00b84a; }

    .btn-sm { padding: 4px 10px; font-size: 10px; }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-box input {
      flex: 1;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--green); }
    .search-box input::placeholder { color: var(--text-muted); }

    .empty { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

    /* ===== QUICK ACTIONS ===== */
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .qa-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
    }
    .qa-card h4 { font-size: 13px; margin-bottom: 10px; }
    .qa-card input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      margin-bottom: 6px;
      outline: none;
    }
    .qa-card input:focus { border-color: var(--green); }
    .qa-card .btn { width: 100%; padding: 8px; font-size: 13px; }

    /* ===== LOGIN ===== */
    .login {
      max-width: 380px;
      margin: 80px auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 40px;
      backdrop-filter: blur(10px);
    }
    .login h1 {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00c853, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login .sub {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .login input {
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    .login input:focus { border-color: var(--green); }
    .login .btn { width: 100%; padding: 14px; font-size: 16px; background: linear-gradient(135deg, var(--green), #009624); color: #000; border: none; border-radius: 100px; cursor: pointer; font-weight: 700; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .quick-actions { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .header-left h1 { font-size: 20px; }
      .header { flex-direction: column; align-items: flex-start; }
      .header-right { width: 100%; }
    }

    .file-link {
      color: var(--blue);
      text-decoration: none;
      font-size: 12px;
    }
    .file-link:hover { text-decoration: underline; }

    .reload-btn {
      padding: 6px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 100px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
    }
    .reload-btn:hover { background: rgba(255,255,255,0.06); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 100px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container" id="app"></div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const API_BASE = 'https://smartbot-genius-bot.myaibuzcom-hue.deno.net';
    const DASHBOARD_PIN = '1925';
    let authenticated = sessionStorage.getItem('sb_auth') === 'true';

    // ============================================================
    // API CALLS
    // ============================================================
    async function fetchStats() {
      const res = await fetch(API_BASE + '/api/sb-stats');
      return res.json();
    }

    async function fetchProjects() {
      const res = await fetch(API_BASE + '/api/sb-projects');
      return res.json();
    }

    async function fetchBriefs() {
      const res = await fetch(API_BASE + '/api/sb-briefs');
      return res.json();
    }

    async function fetchLeads() {
      const res = await fetch(API_BASE + '/api/sb-leads');
      return res.json();
    }

    // ============================================================
    // QUICK ACTIONS
    // ============================================================
    async function addProject() {
      const name = document.getElementById('qaName').value.trim();
      const phone = document.getElementById('qaPhone').value.trim();
      const service = document.getElementById('qaService').value.trim();
      const business = document.getElementById('qaBusiness').value.trim();
      const budget = document.getElementById('qaBudget').value.trim();

      if (!name || !phone || !service) {
        alert('Please fill in Name, Phone and Service');
        return;
      }

      const res = await fetch(API_BASE + '/api/sb-quick-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'add-project',
          data: { name, phone, business, service, description: 'Manual entry from dashboard', budget }
        })
      });
      const data = await res.json();
      if (data.success) {
        alert('✅ Project added successfully!');
        document.getElementById('qaName').value = '';
        document.getElementById('qaPhone').value = '';
        document.getElementById('qaService').value = '';
        document.getElementById('qaBusiness').value = '';
        document.getElementById('qaBudget').value = '';
        render();
      } else {
        alert('❌ Error: ' + (data.error || 'Unknown error'));
      }
    }

    async function addLead() {
      const name = document.getElementById('qlName').value.trim();
      const phone = document.getElementById('qlPhone').value.trim();
      const course = document.getElementById('qlCourse').value.trim();
      const destination = document.getElementById('qlDestination').value.trim();

      if (!name || !phone) {
        alert('Please fill in Name and Phone');
        return;
      }

      const res = await fetch(API_BASE + '/api/sb-quick-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'add-lead',
          data: { name, phone, course, destination }
        })
      });
      const data = await res.json();
      if (data.success) {
        alert('✅ Lead added successfully!');
        document.getElementById('qlName').value = '';
        document.getElementById('qlPhone').value = '';
        document.getElementById('qlCourse').value = '';
        document.getElementById('qlDestination').value = '';
        render();
      } else {
        alert('❌ Error: ' + (data.error || 'Unknown error'));
      }
    }

    // ============================================================
    // LOGIN / LOGOUT
    // ============================================================
    function login() {
      const pin = document.getElementById('pin').value;
      if (pin === DASHBOARD_PIN) {
        sessionStorage.setItem('sb_auth', 'true');
        authenticated = true;
        render();
      } else {
        alert('Wrong PIN');
      }
    }

    function logout() {
      sessionStorage.removeItem('sb_auth');
      authenticated = false;
      render();
    }

    // ============================================================
    // TABS
    // ============================================================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      const content = document.getElementById('tab-' + tabId);
      if (content) content.classList.add('active');
      const tabBtn = document.querySelector('.tab[data-tab="' + tabId + '"]');
      if (tabBtn) tabBtn.classList.add('active');
    }

    // ============================================================
    // SEARCH
    // ============================================================
    function filterProjects() {
      const query = document.getElementById('projectSearch').value.toLowerCase();
      const rows = document.querySelectorAll('#projectsTable tbody tr');
      rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
    }

    function filterLeads() {
      const query = document.getElementById('leadSearch').value.toLowerCase();
      const rows = document.querySelectorAll('#leadsTable tbody tr');
      rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
    }

    // ============================================================
    // RENDER
    // ============================================================
    async function render() {
      const app = document.getElementById('app');

      if (!authenticated) {
        app.innerHTML = `
          <div class="login">
            <h1>SmartBot Builds</h1>
            <p class="sub">Command Center Access</p>
            <input type="password" id="pin" placeholder="Enter PIN" onkeypress="if(event.key==='Enter') login()">
            <button class="btn" onclick="login()">Unlock</button>
          </div>
        `;
        return;
      }

      try {
        const [stats, projects, briefs, leads] = await Promise.all([
          fetchStats(),
          fetchProjects(),
          fetchBriefs(),
          fetchLeads()
        ]);

        const totalProjects = stats.total_projects || 0;
        const briefsUploaded = stats.briefs_uploaded || 0;
        const newLeads = stats.new_leads_30d || 0;
        const converted = stats.converted || 0;
        const pipelineValue = stats.pipeline_value || 0;
        const convertedValue = stats.converted_value || 0;
        const target = 500000;
        const pct = Math.min((pipelineValue / target) * 100, 100);

        const statusColors = {
          'new': 'badge-new',
          'brief_received': 'badge-brief_received',
          'quoted': 'badge-quoted',
          'converted': 'badge-converted'
        };

        app.innerHTML = `
          <!-- HEADER -->
          <div class="header">
            <div class="header-left">
              <h1>🚀 Command Center</h1>
              <p>SmartBot Builds — Custom AI & Automation Agency</p>
            </div>
            <div class="header-right">
              <div class="status-badge">
                <span class="status-dot"></span>
                System Online
              </div>
              <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
          </div>

          <!-- STATS -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="number blue">${totalProjects}</div>
              <div class="label">📋 Total Projects</div>
              <div class="glow"></div>
            </div>
            <div class="stat-card">
              <div class="number green">${briefsUploaded}</div>
              <div class="label">📎 Briefs Uploaded</div>
              <div class="glow"></div>
            </div>
            <div class="stat-card">
              <div class="number orange">${newLeads}</div>
              <div class="label">🧑‍💻 New Leads (30d)</div>
              <div class="glow"></div>
            </div>
            <div class="stat-card">
              <div class="number purple">${converted}</div>
              <div class="label">✅ Converted</div>
              <div class="glow"></div>
            </div>
          </div>

          <!-- REVENUE BAR -->
          <div class="revenue-bar-wrap">
            <div class="row">
              <span class="label">💰 Pipeline Value</span>
              <span class="value">₦${pipelineValue.toLocaleString()} / ₦${target.toLocaleString()}</span>
            </div>
            <div class="progress-track">
              <div class="fill" style="width: ${pct}%;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:12px; color:var(--text-secondary);">
              <span>${Math.round(pct)}% of target</span>
              <span>₦${(target - pipelineValue).toLocaleString()} remaining</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--text-secondary);">
              <span>✅ Converted: ₦${convertedValue.toLocaleString()}</span>
              <span>📊 ${totalProjects > 0 ? Math.round((converted / totalProjects) * 100) : 0}% conversion rate</span>
            </div>
          </div>

          <!-- QUICK ACTIONS -->
          <div class="quick-actions">
            <div class="qa-card">
              <h4>➕ Add Project</h4>
              <input type="text" id="qaName" placeholder="Full Name *">
              <input type="text" id="qaPhone" placeholder="Phone *">
              <input type="text" id="qaService" placeholder="Service Type *">
              <input type="text" id="qaBusiness" placeholder="Business Name">
              <input type="text" id="qaBudget" placeholder="Budget (₦)">
              <button class="btn btn-green" onclick="addProject()">Add Project</button>
            </div>
            <div class="qa-card">
              <h4>➕ Add Lead</h4>
              <input type="text" id="qlName" placeholder="Full Name *">
              <input type="text" id="qlPhone" placeholder="Phone *">
              <input type="text" id="qlCourse" placeholder="Course / Interest">
              <input type="text" id="qlDestination" placeholder="Destination">
              <button class="btn btn-primary" onclick="addLead()">Add Lead</button>
            </div>
          </div>

          <!-- TABS -->
          <div class="tabs">
            <button class="tab active" data-tab="projects" onclick="switchTab('projects')">📋 Projects</button>
            <button class="tab" data-tab="briefs" onclick="switchTab('briefs')">📎 Briefs</button>
            <button class="tab" data-tab="leads" onclick="switchTab('leads')">🧑‍💻 Leads</button>
          </div>

          <!-- TAB: PROJECTS -->
          <div id="tab-projects" class="tab-content active">
            <div class="search-box">
              <input type="text" id="projectSearch" placeholder="🔍 Search projects..." onkeyup="filterProjects()">
            </div>
            <div class="table-wrap">
              <table id="projectsTable">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Business</th>
                    <th>Service</th>
                    <th>Budget</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Brief</th>
                  </tr>
                </thead>
                <tbody>
                  ${projects.length === 0 ? '<tr><td colspan="7" class="empty">No projects yet.</td></tr>' : projects.map(p => `
                    <tr>
                      <td><strong>${p.name || 'Unknown'}</strong></td>
                      <td>${p.business_name || '—'}</td>
                      <td>${p.service_type || '—'}</td>
                      <td>${p.budget ? '₦' + Number(p.budget).toLocaleString() : '—'}</td>
                      <td><span class="badge ${statusColors[p.status] || 'badge-new'}">${p.status || 'new'}</span></td>
                      <td style="font-size:12px; color:var(--text-secondary);">${new Date(p.created_at).toLocaleDateString()}</td>
                      <td>${p.brief_file_url ? `<a href="${p.brief_file_url}" target="_blank" class="file-link">📎 View</a>` : '—'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- TAB: BRIEFS -->
          <div id="tab-briefs" class="tab-content">
            ${briefs.length === 0 ? '<div class="empty">No briefs uploaded yet.</div>' : `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>File Name</th>
                    <th>From</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>View</th>
                  </tr>
                </thead>
                <tbody>
                  ${briefs.map(b => `
                    <tr>
                      <td>${b.brief_file_name || 'Brief'}</td>
                      <td>${b.name || b.phone || 'Unknown'}</td>
                      <td>${b.service_type || '—'}</td>
                      <td style="font-size:12px; color:var(--text-secondary);">${new Date(b.created_at).toLocaleDateString()}</td>
                      <td>${b.brief_file_url ? `<a href="${b.brief_file_url}" target="_blank" class="file-link">👁️ View</a>` : '—'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            `}
          </div>

          <!-- TAB: LEADS -->
          <div id="tab-leads" class="tab-content">
            <div class="search-box">
              <input type="text" id="leadSearch" placeholder="🔍 Search leads..." onkeyup="filterLeads()">
            </div>
            <div class="table-wrap">
              <table id="leadsTable">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Destination</th>
                    <th>Status</th>
                    <th>Tag</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody>
                  ${leads.length === 0 ? '<tr><td colspan="7" class="empty">No leads yet.</td></tr>' : leads.map(l => `
                    <tr>
                      <td><strong>${l.full_name || 'Unknown'}</strong></td>
                      <td>${l.lead_phone || '—'}</td>
                      <td>${l.course || '—'}</td>
                      <td>${l.destination_category || '—'}</td>
                      <td><span class="badge badge-new">${l.status || 'New'}</span></td>
                      <td style="font-size:11px; color:var(--text-secondary);">${l.tag || '—'}</td>
                      <td style="font-size:12px; color:var(--text-secondary);">${new Date(l.created_at).toLocaleDateString()}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;

        // Re-bind search handlers after render
        const projSearch = document.getElementById('projectSearch');
        if (projSearch) projSearch.addEventListener('input', filterProjects);
        const leadSearch = document.getElementById('leadSearch');
        if (leadSearch) leadSearch.addEventListener('input', filterLeads);

      } catch (err) {
        app.innerHTML = `
          <div style="text-align:center; padding:60px 20px; color:var(--red);">
            <h2>⚠️ Error loading dashboard</h2>
            <p style="color:var(--text-secondary);">${err.message}</p>
            <button class="btn btn-primary" style="margin-top:16px; padding:10px 24px;" onclick="render()">Retry</button>
          </div>
        `;
        console.error('Render error:', err);
      }
    }

    render();
  </script>
</body>
</html>
